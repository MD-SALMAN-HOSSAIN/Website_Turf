<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Floodlit pitch at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="70%" stop-color="#12241a"/>
      <stop offset="100%" stop-color="#1c5a2a"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fff7c2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#night)"/>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="140" cy="90" r="4"/><circle cx="330" cy="60" r="3"/><circle cx="520" cy="110" r="3"/>
    <circle cx="760" cy="70" r="4"/><circle cx="980" cy="120" r="3"/><circle cx="1120" cy="60" r="4"/>
  </g>
  <polygon points="150,140 60,560 520,560" fill="url(#beam)"/>
  <polygon points="1050,140 680,560 1140,560" fill="url(#beam)"/>
  <g>
    <rect x="140" y="150" width="20" height="430" fill="#2b3b2f"/>
    <rect x="1040" y="150" width="20" height="430" fill="#2b3b2f"/>
    <g fill="#ffe066">
      <rect x="100" y="120" width="100" height="34" rx="8"/>
      <rect x="1000" y="120" width="100" height="34" rx="8"/>
    </g>
  </g>
  <rect x="0" y="560" width="1200" height="115" fill="#1f6b30"/>
  <text x="600" y="635" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffffff" fill-opacity="0.95">FLOODLIGHTS TILL LATE</text>
</svg>
